<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astaro-Next - WebAdmin Console</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            astaro: {
              DEFAULT: '#005299',
              blue: '#005299',
              orange: '#ee7f00',
              amber: '#f48d20',
              navy: '#1a2332',
              slate: '#232f3e',
              canvas: '#f4f3f2',
              gray: '#f7f7f7',
              border: '#e4e4e7',
              green: '#009900',
              red: '#cc0000',
            },
            utm: {
              DEFAULT: '#005299',
              blue: '#005299',
              orange: '#ee7f00',
              navy: '#1a2332',
              slate: '#232f3e',
              accent: '#ee7f00',
              green: '#009900',
            }
          }
        }
      }
    }
  </script>
  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- vue3-sfc-loader for direct in-browser .vue SFC execution -->
  <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader/dist/vue3-sfc-loader.js"></script>
</head>
<body class="bg-[#161e29] text-slate-100 antialiased selection:bg-[#0072ce] selection:text-white">
  <div id="app"></div>

  <script>
    const { loadModule } = window['vue3-sfc-loader'];

    const options = {
      moduleCache: {
        vue: Vue
      },
      async getFile(url) {
        const res = await fetch(url);
        if (!res.ok)
          throw Object.assign(new Error(res.statusText + ' ' + url), { res });
        return {
          getContentData: asBinary => asBinary ? res.arrayBuffer() : res.text(),
        };
      },
      addStyle(textContent) {
        const style = document.createElement('style');
        style.textContent = textContent;
        const ref = document.head.getElementsByTagName('style')[0] || null;
        document.head.insertBefore(style, ref);
      },
    };

    // Global Administrative Authentication Credentials
    const DEFAULT_TOKEN = 'astaro-admin-sec-key-9982441';
    if (typeof localStorage !== 'undefined' && !localStorage.getItem('astaro_token')) {
      localStorage.setItem('astaro_token', DEFAULT_TOKEN);
    }
    const currentToken = (typeof localStorage !== 'undefined' ? localStorage.getItem('astaro_token') : null) || DEFAULT_TOKEN;
    if (window.axios) {
      window.axios.defaults.headers.common['Authorization'] = `Bearer ${currentToken}`;
      window.axios.defaults.headers.common['X-API-Key'] = currentToken;
    }

    const app = Vue.createApp({
      components: {
        'firewall-rules': Vue.defineAsyncComponent(() => loadModule('./FirewallRules.vue', options)),
        'waf-settings': Vue.defineAsyncComponent(() => loadModule('./WafSettings.vue', options)),
        'interfaces-view': Vue.defineAsyncComponent(() => loadModule('./Interfaces.vue', options)),
        'control-center': Vue.defineAsyncComponent(() => loadModule('./ControlCenter.vue', options)),
        'web-protection': Vue.defineAsyncComponent(() => loadModule('./WebProtection.vue', options)),
        'mail-manager': Vue.defineAsyncComponent(() => loadModule('./MailManager.vue', options)),
        'setup-wizard': Vue.defineAsyncComponent(() => loadModule('./SetupWizard.vue', options)),
        'certificates-view': Vue.defineAsyncComponent(() => loadModule('./Certificates.vue', options)),
        'vpn-settings': Vue.defineAsyncComponent(() => loadModule('./VpnSettings.vue', options)),
        'main-layout': Vue.defineAsyncComponent(() => loadModule('./MainLayout.vue', options))
      },
      data() {
        return {
          currentSection: 'monitor_analyze',
          currentItem: 'control_center',
          authToken: currentToken
        }
      },
      template: `
        <setup-wizard
          v-if="currentItem === 'setup_wizard' || currentItem === 'wizard'"
          :authToken="authToken"
          @completed="currentItem = 'control_center'; currentSection = 'monitor_analyze'"
        />
        <main-layout
          v-else
          :initialSection="currentSection"
          :initialItem="currentItem"
          @navigate="handleNavigate"
        >
          <control-center
            v-if="currentItem === 'control_center' || currentItem === 'dashboard'"
            :authToken="authToken"
          />
          <web-protection
            v-else-if="currentItem === 'web' || currentItem === 'web_protection' || currentItem === 'zenarmor' || currentItem === 'zenarmor_profiles'"
            :authToken="authToken"
          />
          <mail-manager
            v-else-if="currentItem === 'email' || currentItem === 'mail_manager' || currentItem === 'mail' || currentItem === 'mail_quarantine' || currentItem === 'postfix'"
            :authToken="authToken"
          />
          <firewall-rules
            v-else-if="currentItem === 'rules_policies' || currentItem === 'firewall_rules' || currentItem === 'firewall'"
            :authToken="authToken"
          />
          <interfaces-view
            v-else-if="currentItem === 'network' || currentItem === 'interfaces' || currentItem === 'network_interfaces'"
            :authToken="authToken"
          />
          <vpn-settings
            v-else-if="currentItem === 'vpn' || currentItem === 'vpn_settings' || currentItem === 'wireguard' || currentItem === 'wireguard_vpn' || currentItem === 'ipsec' || currentItem === 'openvpn'"
            :authToken="authToken"
          />
          <certificates-view
            v-else-if="currentItem === 'certificates' || currentItem === 'certs' || currentItem === 'pki'"
            :authToken="authToken"
          />
          <waf-settings
            v-else-if="currentItem === 'web_server' || currentItem === 'waf_reverse_proxy' || currentItem === 'waf'"
            :authToken="authToken"
            @close="currentItem = 'rules_policies'"
          />
          <control-center v-else :authToken="authToken" />
        </main-layout>
      `,
      async mounted() {
        try {
          const res = await axios.get('/api/system/init-status');
          if (res.data && res.data.initialized === false) {
            this.currentItem = 'setup_wizard';
          }
        } catch (e) {
          // Backend offline or unreachable during initial load - retain default control center
        }
      },
      methods: {
        handleNavigate(navEvent) {
          if (typeof navEvent === 'string') {
            this.currentItem = navEvent;
          } else if (navEvent && navEvent.itemId) {
            this.currentItem = navEvent.itemId;
            this.currentSection = navEvent.groupId;
          }
        },
        handleClose() {
          console.log('Close action requested');
        }
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
